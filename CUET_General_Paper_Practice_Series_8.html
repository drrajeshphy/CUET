<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CUET General Paper Practice – Series 8</title>
<style>
:root{
  --navy:#10234b; --blue:#2457d6; --cyan:#16b8c8; --ink:#17233d;
  --muted:#68758d; --paper:#f4f7ff; --white:#fff; --green:#16834a;
  --red:#d6334c; --gold:#f2b544; --line:#e3e9f5;
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; font-family:Inter,Segoe UI,Arial,sans-serif;
  color:var(--ink); background:
  radial-gradient(circle at 8% 10%,rgba(22,184,200,.17),transparent 27%),
  radial-gradient(circle at 92% 88%,rgba(36,87,214,.15),transparent 30%),var(--paper);
  display:flex; justify-content:center; padding:24px 14px;
}
.app{width:min(960px,100%); align-self:flex-start}
.school-header{
  text-align:center; color:white; padding:24px 18px 22px; border-radius:22px 22px 0 0;
  background:linear-gradient(120deg,#101f45,#214eaa 58%,#087f99);
  box-shadow:0 14px 35px rgba(16,35,75,.18); position:relative; overflow:hidden;
}
.school-header:before,.school-header:after{
  content:""; position:absolute; border:1px solid rgba(255,255,255,.16); border-radius:50%;
  width:210px;height:210px;top:-130px;left:-50px
}
.school-header:after{left:auto;right:-65px;top:auto;bottom:-155px;width:260px;height:260px}
.cell{font-size:clamp(13px,2vw,17px);font-weight:700;letter-spacing:1.2px;text-transform:uppercase}
.school{font-size:clamp(13px,2vw,16px);margin-top:7px;color:#dceaff;font-weight:600}
.series{font-size:clamp(20px,4vw,30px);font-weight:900;letter-spacing:.5px;margin-top:17px}
.subline{font-size:12px;color:#d5e6ff;margin-top:7px;letter-spacing:1.6px}
.panel{
  background:rgba(255,255,255,.96); border:1px solid var(--line); border-top:0;
  border-radius:0 0 22px 22px; padding:clamp(17px,4vw,34px);
  box-shadow:0 18px 45px rgba(16,35,75,.10)
}
.toprow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:15px}
.tag{background:#eaf1ff;color:#234ba8;padding:8px 12px;border-radius:999px;font-size:12px;font-weight:800;letter-spacing:.5px}
.counter{font-weight:800;color:var(--muted);font-size:13px}
.progress{height:8px;background:#e9eef8;border-radius:20px;overflow:hidden;margin-bottom:24px}
.progress span{display:block;height:100%;width:10%;background:linear-gradient(90deg,var(--cyan),var(--blue));border-radius:20px;transition:width .3s}
.question{font-size:clamp(19px,3vw,25px);line-height:1.42;font-weight:800;margin:8px 0 22px}
.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.option{
  border:1.5px solid var(--line);border-radius:14px;background:#fff;padding:15px 16px;
  text-align:left;display:flex;gap:12px;align-items:center;cursor:pointer;
  font-size:15px;color:var(--ink);font-weight:600;min-height:62px;transition:.18s;
}
.option:hover:not(:disabled){border-color:#8da9ee;background:#f7f9ff;transform:translateY(-1px)}
.letter{width:29px;height:29px;flex:0 0 29px;border-radius:9px;background:#edf2fc;color:#3155a2;display:grid;place-items:center;font-weight:900}
.option.correct{border-color:var(--green);background:#eaf8f0;color:#12643a}
.option.correct .letter{background:var(--green);color:white}
.option.wrong{border-color:var(--red);background:#fff0f2;color:#9f2034}
.option.wrong .letter{background:var(--red);color:white}
.option:disabled{cursor:default}
.mark{margin-left:auto;font-size:21px;font-weight:900}
.feedback{display:none;margin-top:17px;border-radius:13px;padding:13px 15px;font-weight:700}
.feedback.good{display:block;color:#12643a;background:#eaf8f0;border:1px solid #bce8cc}
.feedback.bad{display:block;color:#a3263b;background:#fff0f2;border:1px solid #f4c4cd}
.solution{display:none;margin-top:12px;background:#f3f6fc;border-left:4px solid var(--blue);padding:14px 16px;border-radius:9px;line-height:1.55;color:#35435e}
.solution.show{display:block}
.controls{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:24px}
button.action{border:0;border-radius:12px;padding:13px 19px;font-weight:800;font-size:14px;cursor:pointer}
.primary{background:linear-gradient(120deg,var(--blue),#168da9);color:white;box-shadow:0 6px 15px rgba(36,87,214,.2)}
.secondary{background:#edf2fc;color:#24427e}
.action:disabled{opacity:.4;cursor:not-allowed}
.result{display:none;text-align:center;padding:16px 5px}
.result.show{display:block}
.score-circle{width:150px;height:150px;border-radius:50%;margin:20px auto;display:grid;place-items:center;background:conic-gradient(var(--cyan) 0deg,var(--blue) 0deg,#e8edf7 0deg);position:relative}
.score-circle:before{content:"";position:absolute;inset:11px;border-radius:50%;background:white}
.score-inner{position:relative;z-index:1}
.score-number{font-size:39px;font-weight:900;color:var(--navy)}
.score-label{font-size:12px;color:var(--muted);font-weight:700}
.result h2{color:var(--navy);font-size:27px}
.result p{color:var(--muted)}
.review{margin:20px auto 0;max-width:650px;text-align:left}
.review-item{padding:12px;border:1px solid var(--line);border-radius:10px;margin:8px 0;font-size:14px}
.review-item b{display:block;margin-bottom:5px}
.footer{text-align:center;color:#8390a7;font-size:11px;margin-top:18px}
@media(max-width:650px){.options{grid-template-columns:1fr}.panel{padding:18px}.option{min-height:55px}.controls button{flex:1}}
</style>
</head>
<body>
<div class="app">
  <header class="school-header">
    <div class="cell">Career Guidance and Adolescent Counselling Cell</div>
    <div class="school">St.Gemma's Girls' HSS Malappuram</div>
    <div class="series">CUET GENERAL PAPER PRACTICE – SERIES 8</div>
    <div class="subline">LEARN • PRACTISE • IMPROVE</div>
  </header>
  <main class="panel">
    <div id="quiz">
      <div class="toprow">
        <span class="tag" id="category">GENERAL AWARENESS</span>
        <span class="counter" id="counter">QUESTION 1 OF 10</span>
      </div>
      <div class="progress"><span id="progressBar"></span></div>
      <div class="question" id="question"></div>
      <div class="options" id="options"></div>
      <div class="feedback" id="feedback" aria-live="polite"></div>
      <div class="solution" id="solution"></div>
      <div class="controls">
        <button class="action secondary" id="solutionBtn" disabled>View Solution</button>
        <button class="action primary" id="nextBtn" disabled>Next Question →</button>
      </div>
    </div>
    <section class="result" id="result">
      <span class="tag">SERIES 8 COMPLETED</span>
      <h2>Your Practice Result</h2>
      <div class="score-circle" id="scoreCircle"><div class="score-inner"><div class="score-number" id="scoreNumber">0/10</div><div class="score-label">YOUR SCORE</div></div></div>
      <h3 id="performance"></h3>
      <p id="summary"></p>
      <div class="controls" style="justify-content:center">
        <button class="action primary" onclick="restartQuiz()">↻ Practise Again</button>
        <button class="action secondary" onclick="showReview()">Review Answers</button>
      </div>
      <div class="review" id="review" style="display:none"></div>
    </section>
  </main>
  <div class="footer">CUET UG • GENERAL TEST • Prepared for student practice</div>
</div>
<script>
const questions = [
 {cat:"GENERAL AWARENESS",q:"Which Harappan site is particularly associated with the discovery of a dockyard?",o:["Kalibangan","Lothal","Harappa","Banawali"],a:1,s:"Lothal, located in present-day Gujarat, is well known for its dockyard, which indicates the importance of maritime trade in the Harappan civilisation."},
 {cat:"GENERAL AWARENESS",q:"Who introduced the Permanent Settlement in Bengal in 1793?",o:["Lord Wellesley","Lord Dalhousie","Lord Cornwallis","Warren Hastings"],a:2,s:"Lord Cornwallis introduced the Permanent Settlement in 1793. It fixed the land revenue payable by zamindars to the East India Company."},
 {cat:"GENERAL AWARENESS",q:"Which Article of the Indian Constitution guarantees equality before the law?",o:["Article 12","Article 14","Article 19","Article 21"],a:1,s:"Article 14 guarantees equality before the law and equal protection of the laws to every person within the territory of India."},
 {cat:"GENERAL AWARENESS",q:"Which institution is responsible for auditing the accounts of the Union and State Governments?",o:["Finance Commission","Election Commission","Comptroller and Auditor General","Union Public Service Commission"],a:2,s:"The Comptroller and Auditor General of India (CAG) audits the accounts of the Union and State Governments and helps ensure public financial accountability."},
 {cat:"GENERAL AWARENESS",q:"Which Indian state has the longest coastline?",o:["Tamil Nadu","Andhra Pradesh","Gujarat","Maharashtra"],a:2,s:"Gujarat has the longest coastline among Indian states. Its coastline extends along the Arabian Sea and includes the Gulf of Kachchh and Gulf of Khambhat."},
 {cat:"GENERAL AWARENESS",q:"Which international organisation publishes the Human Development Report?",o:["World Bank","International Monetary Fund","United Nations Development Programme","World Trade Organization"],a:2,s:"The United Nations Development Programme (UNDP) publishes the Human Development Report, which includes the Human Development Index (HDI)."},
 {cat:"QUANTITATIVE APTITUDE",q:"If 15 workers can build a wall in 8 days, how many workers are needed to build the same wall in 6 days?",o:["18","20","22","24"],a:1,s:"For the same work, workers × days remains constant. 15 × 8 = x × 6, so x = 120 ÷ 6 = 20 workers."},
 {cat:"QUANTITATIVE APTITUDE",q:"The mean of 10 observations was calculated as 15. Later, one observation was found to have been recorded as 26 instead of 16. Find the corrected mean.",o:["14","14.5","15.5","16"],a:0,s:"Original total = 10 × 15 = 150. Corrected total = 150 − 26 + 16 = 140. Corrected mean = 140 ÷ 10 = 14."},
 {cat:"LOGICAL & ANALYTICAL REASONING",q:"Complete the letter series: A, C, F, J, O, ____",o:["R","S","U","V"],a:2,s:"The alphabetical gaps increase by one each time: +2, +3, +4, +5. The next gap is +6. O + 6 = U."},
 {cat:"LOGICAL & ANALYTICAL REASONING",q:"Five students A, B, C, D and E are sitting in a row facing North. C is sitting between A and E. B is immediately to the right of E. D is at the left end. Who is in the middle?",o:["A","C","E","B"],a:1,s:"The order from left to right is D, A, C, E, B. Therefore, C occupies the middle (third) position."}
];
let index=0, score=0, chosen=Array(questions.length).fill(null), answered=Array(questions.length).fill(false);
const $=id=>document.getElementById(id);
function render(){
 const item=questions[index];
 $("category").textContent=item.cat;
 $("counter").textContent=`QUESTION ${index+1} OF ${questions.length}`;
 $("progressBar").style.width=((index+1)/questions.length*100)+"%";
 $("question").textContent=item.q;
 $("options").innerHTML="";
 $("feedback").className="feedback"; $("feedback").textContent="";
 $("solution").className="solution"; $("solution").textContent="";
 $("solutionBtn").disabled=!answered[index];
 $("nextBtn").disabled=!answered[index];
 $("nextBtn").textContent=index===questions.length-1?"View My Score →":"Next Question →";
 item.o.forEach((option,i)=>{
   const b=document.createElement("button"); b.className="option";
   b.innerHTML=`<span class="letter">${"ABCD"[i]}</span><span></span><span class="mark"></span>`;
   b.children[1].textContent=option;
   if(answered[index]){
     b.disabled=true;
     if(i===item.a){b.classList.add("correct");b.children[2].textContent="✓";}
     if(i===chosen[index] && i!==item.a){b.classList.add("wrong");b.children[2].textContent="✕";}
   }else b.addEventListener("click",()=>selectAnswer(i));
   $("options").appendChild(b);
 });
 if(answered[index]){
   const correct=chosen[index]===item.a;
   $("feedback").className="feedback "+(correct?"good":"bad");
   $("feedback").textContent=correct?"✓ Correct answer! Well done.":"✕ Not quite. The correct answer is "+ "ABCD"[item.a]+".";
 }
}
function selectAnswer(i){
 if(answered[index])return;
 chosen[index]=i; answered[index]=true;
 if(i===questions[index].a)score++;
 render();
 $("solutionBtn").disabled=false;$("nextBtn").disabled=false;
}
$("solutionBtn").addEventListener("click",()=>{
 $("solution").textContent="Explanation: "+questions[index].s;
 $("solution").classList.toggle("show");
 $("solutionBtn").textContent=$("solution").classList.contains("show")?"Hide Solution":"View Solution";
});
$("nextBtn").addEventListener("click",()=>{
 if(index<questions.length-1){index++;render();}
 else showResult();
});
function showResult(){
 $("quiz").style.display="none";$("result").classList.add("show");
 $("scoreNumber").textContent=score+"/10";
 const deg=score/10*360;
 $("scoreCircle").style.background=`conic-gradient(var(--cyan) 0deg,var(--blue) ${deg}deg,#e8edf7 ${deg}deg 360deg)`;
 let msg=score>=9?"Outstanding! Excellent preparation.":score>=7?"Very good! Keep practising.":score>=5?"Good effort. Revise the explanations and try again.":"Keep learning. Review each solution and practise again.";
 $("performance").textContent=msg;
 $("summary").textContent=`You answered ${score} out of 10 questions correctly.`;
}
function showReview(){
 const box=$("review");box.style.display=box.style.display==="none"?"block":"none";
 box.innerHTML="<h3>Answer Review</h3>"+questions.map((q,i)=>`<div class="review-item"><b>${i+1}. ${q.q}</b><span>${chosen[i]===q.a?"✓ Correct":"✕ Your answer: "+(chosen[i]===null?"Not attempted": "ABCD"[chosen[i]])} · Correct answer: ${"ABCD"[q.a]}. ${q.o[q.a]}</span><p>${q.s}</p></div>`).join("");
}
function restartQuiz(){index=0;score=0;chosen=Array(questions.length).fill(null);answered=Array(questions.length).fill(false);$("quiz").style.display="block";$("result").classList.remove("show");$("review").style.display="none";$("solutionBtn").textContent="View Solution";render();}
render();
</script>
</body>
</html>
